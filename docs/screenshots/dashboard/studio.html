<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Review Queue Screenshot Studio</title>
  <style>
    :root {
      --ink: #0e1824;
      --text: #17212f;
      --muted: #667386;
      --faint: #8b96a7;
      --edge: #dfe4ea;
      --soft-edge: #edf0f3;
      --card: #ffffff;
      --page: #f6f7f9;
      --accent: #2368d8;
      --ok: #157347;
      --ok-bg: #ecf8f1;
      --ok-edge: #c6ead5;
      --warn: #8c5a08;
      --warn-bg: #fff8e6;
      --warn-edge: #f2d99d;
      --bad: #b42318;
      --bad-bg: #fff1f0;
      --bad-edge: #f3c5c1;
      --shadow: 0 1px 2px rgb(14 24 36 / .05), 0 5px 16px rgb(14 24 36 / .04);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--page);
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { background: var(--page); font-size: 13px; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .topbar {
      position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px;
      min-height: 51px; padding: 9px 24px; color: #fff; background: var(--ink);
      box-shadow: 0 8px 24px rgb(14 24 36 / .16);
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: max-content; }
    .brandmark { padding: 3px 7px; border-radius: 5px; color: #10251a; background: #b9f4d2; font: 650 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .brandcopy { display: grid; gap: 3px; line-height: 1; }
    .brandname { font-size: 14.5px; font-weight: 680; letter-spacing: -.015em; }
    .brandsub { color: rgb(255 255 255 / .45); font: 9px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; }
    .nav { display: flex; align-items: center; gap: 4px; }
    .nav button { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border: 0; border-radius: 6px; color: rgb(255 255 255 / .66); background: transparent; font-size: 13px; font-weight: 570; }
    .nav button:hover { color: #fff; background: rgb(255 255 255 / .08); }
    .nav button.active { color: var(--ink); background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
    .nav svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .live { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 5px 9px; border: 1px solid rgb(104 217 155 / .3); border-radius: 99px; color: #a7edc5; background: rgb(104 217 155 / .1); font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #68d99b; box-shadow: 0 0 0 3px rgb(104 217 155 / .12); }
    main { width: min(1400px, calc(100% - 48px)); margin: 0 auto; padding: 18px 0 56px; }
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) repeat(4, minmax(92px, 120px)); align-items: stretch; margin-bottom: 14px; overflow: hidden; border: 1px solid var(--edge); border-radius: 11px; background: #fff; box-shadow: var(--shadow); }
    .hero-main { min-width: 0; padding: 18px 20px; }
    .eyebrow { margin: 0 0 7px; color: var(--faint); font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .1em; text-transform: uppercase; }
    .headline { display: flex; align-items: baseline; gap: 10px; margin: 0; color: var(--ink); font-size: 22px; font-weight: 700; letter-spacing: -.025em; }
    .headline .clock { color: var(--accent); font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .detail { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .summary { margin: 10px 0 0; color: var(--faint); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .stat { display: grid; align-content: center; gap: 6px; padding: 14px 16px; border-left: 1px solid var(--soft-edge); }
    .stat-label { color: var(--faint); font: 9.5px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; }
    .stat-value { color: var(--ink); font-size: 17px; font-weight: 690; }
    .stat-meta { color: var(--faint); font-size: 10.5px; line-height: 1.35; }
    .attention { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; padding: 10px 14px; border: 1px solid var(--bad-edge); border-left: 4px solid var(--bad); border-radius: 10px; background: var(--bad-bg); }
    .attention strong { color: var(--bad); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
    .attention .more { margin-left: auto; color: var(--accent); font-weight: 650; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
    .search { width: 294px; padding: 8px 10px; border: 1px solid var(--edge); border-radius: 8px; color: var(--text); background: #fff; }
    .chip { padding: 5px 11px; border: 1px solid var(--edge); border-radius: 99px; color: var(--muted); background: transparent; font-size: 12px; font-weight: 570; }
    .chip.active { color: #fff; border-color: var(--ink); background: var(--ink); }
    .overview-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
    .stack { display: grid; gap: 14px; }
    .card { overflow: hidden; border: 1px solid var(--edge); border-radius: 10px; background: var(--card); box-shadow: var(--shadow); }
    .card-header { display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 9px 14px; border-bottom: 1px solid var(--soft-edge); }
    .card-title { color: var(--ink); font-size: 13px; font-weight: 680; }
    .count { display: inline-grid; place-items: center; min-width: 21px; height: 19px; padding: 0 6px; border-radius: 99px; color: var(--muted); background: #eef1f4; font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .card-end { margin-left: auto; color: var(--faint); font-size: 10.5px; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 8px 12px; color: var(--faint); background: #fafbfc; font: 9.5px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .06em; text-align: left; text-transform: uppercase; }
    td { padding: 10px 12px; border-top: 1px solid var(--soft-edge); vertical-align: top; }
    thead + tbody tr:first-child td { border-top: 0; }
    tbody tr:hover { background: #fbfcfd; }
    .repo-cell { display: flex; align-items: flex-start; gap: 9px; min-width: 210px; }
    .repo-icon { position: relative; display: grid; place-items: center; flex: 0 0 auto; width: 26px; height: 26px; overflow: hidden; border-radius: 7px; color: #fff; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .22), 0 1px 2px rgb(14 24 36 / .12); }
    .repo-icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .repo-icon.mini { width: 22px; height: 22px; border-radius: 6px; }
    .r-pay { background: linear-gradient(145deg, #7c3aed, #4f46e5); }
    .r-ios { background: linear-gradient(145deg, #0ea5e9, #2563eb); }
    .r-web { background: linear-gradient(145deg, #f97316, #db2777); }
    .r-data { background: linear-gradient(145deg, #059669, #0f766e); }
    .r-design { background: linear-gradient(145deg, #db2777, #9333ea); }
    .r-infra { background: linear-gradient(145deg, #0891b2, #1d4ed8); }
    .r-auth { background: linear-gradient(145deg, #475569, #111827); }
    .r-mail { background: linear-gradient(145deg, #eab308, #ea580c); }
    .r-edge { background: linear-gradient(145deg, #14b8a6, #0284c7); }
    .r-tools { background: linear-gradient(145deg, #64748b, #334155); }
    .repo-name { color: var(--ink); font-weight: 650; line-height: 1.25; }
    .repo-title { max-width: 390px; margin-top: 2px; overflow: hidden; color: var(--muted); font-size: 11.5px; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .sha { color: var(--accent); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .phase, .mark { display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 5px; font-size: 10.5px; font-weight: 650; white-space: nowrap; }
    .phase.ok, .mark.ok { color: var(--ok); background: var(--ok-bg); }
    .phase.warn, .mark.warn { color: var(--warn); background: var(--warn-bg); }
    .phase.mut, .mark.mut { color: var(--muted); background: #eef1f4; }
    .phase.bad, .mark.bad { color: var(--bad); background: var(--bad-bg); }
    .botmarks { display: flex; gap: 4px; align-items: center; }
    .botmark { display: grid; place-items: center; width: 25px; height: 25px; border: 1px solid var(--edge); border-radius: 50%; color: var(--ink); background: #fff; font: 650 9px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .botmark.done { color: #fff; border-color: var(--ok); background: var(--ok); }
    .machine { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    .machine::before { width: 7px; height: 7px; border-radius: 50%; background: #68d99b; content: ""; }
    .queue-pos { width: 22px; color: var(--faint); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .why { color: var(--muted); font-size: 11px; }
    .actions { white-space: nowrap; }
    .small-button { padding: 5px 7px; border: 1px solid var(--edge); border-radius: 6px; color: var(--muted); background: #fff; font-size: 10.5px; font-weight: 620; }
    .empty-pad { padding: 18px 14px; color: var(--faint); }
    .activity { margin: 0; padding: 0; list-style: none; }
    .activity li { display: grid; grid-template-columns: 46px 8px minmax(0, 1fr); gap: 8px; padding: 9px 12px; border-top: 1px solid var(--soft-edge); color: var(--muted); font-size: 11px; line-height: 1.35; }
    .activity li:first-child { border-top: 0; }
    .activity time { color: var(--faint); font: 9.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .event-dot { width: 7px; height: 7px; margin-top: 3px; border-radius: 50%; background: var(--accent); }
    .event-dot.ok { background: var(--ok); }
    .event-dot.warn { background: #d49520; }
    .event-title { color: var(--text); font-weight: 610; }
    .progress { height: 5px; margin-top: 7px; overflow: hidden; border-radius: 99px; background: #e9edf2; }
    .progress > span { display: block; width: 48%; height: 100%; background: linear-gradient(90deg, #3b82f6, #16a34a); }
    .page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .page-head h1 { margin: 0; color: var(--ink); font-size: 19px; letter-spacing: -.02em; }
    .page-head p { margin: 3px 0 0; color: var(--muted); }
    .page-head .right { margin-left: auto; }
    .primary { padding: 7px 11px; border: 1px solid var(--ink); border-radius: 7px; color: #fff; background: var(--ink); font-weight: 650; }
    .repo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .repo-card { padding: 13px; border: 1px solid var(--edge); border-radius: 9px; background: #fff; box-shadow: var(--shadow); }
    .repo-card-top { display: flex; gap: 9px; align-items: center; }
    .repo-card-name { min-width: 0; color: var(--ink); font-weight: 670; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .repo-card .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 13px; }
    .metric { padding: 8px; border-top: 1px solid var(--soft-edge); }
    .metric b { display: block; color: var(--ink); font-size: 15px; }
    .metric span { color: var(--faint); font-size: 9px; text-transform: uppercase; }
    .repo-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .bot-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .bot-card { min-height: 210px; padding: 15px; border: 1px solid var(--edge); border-radius: 9px; background: #fff; box-shadow: var(--shadow); }
    .bot-top { display: flex; align-items: center; gap: 10px; }
    .bot-icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; color: #fff; font: 750 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .b-rabbit { background: linear-gradient(145deg, #f97316, #ef4444); }
    .b-codex { background: linear-gradient(145deg, #0f766e, #064e3b); }
    .b-cursor { background: linear-gradient(145deg, #111827, #4b5563); }
    .b-macro { background: linear-gradient(145deg, #7c3aed, #4338ca); }
    .b-sentinel { background: linear-gradient(145deg, #0369a1, #0e7490); }
    .b-local { background: linear-gradient(145deg, #64748b, #334155); }
    .bot-title { color: var(--ink); font-size: 14px; font-weight: 700; }
    .bot-handle { margin-top: 2px; color: var(--faint); font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bot-copy { margin: 13px 0 0; color: var(--muted); font-size: 11.5px; line-height: 1.55; }
    .bot-foot { display: flex; align-items: center; gap: 7px; margin-top: 14px; padding-top: 11px; border-top: 1px solid var(--soft-edge); }
    .bot-foot .seen { margin-left: auto; color: var(--faint); font-size: 10px; }
    .setup-grid { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 14px; align-items: start; }
    .check-list, .host-list { margin: 0; padding: 0; list-style: none; }
    .check-list li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 9px; padding: 11px 13px; border-top: 1px solid var(--soft-edge); }
    .check-list li:first-child { border-top: 0; }
    .checkmark { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; color: #fff; background: var(--ok); font-size: 11px; }
    .check-label { color: var(--ink); font-weight: 650; }
    .check-detail { margin-top: 2px; color: var(--faint); font-size: 10.5px; }
    .host-list { display: grid; gap: 9px; padding: 11px; }
    .host-card { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--soft-edge); border-radius: 8px; background: #fbfcfd; }
    .computer { position: relative; display: grid; place-items: center; width: 48px; height: 38px; border: 2px solid #94a3b8; border-radius: 6px; color: #526173; background: linear-gradient(#fff, #eef2f6); }
    .computer::after { position: absolute; bottom: -7px; width: 24px; height: 5px; border-top: 2px solid #94a3b8; content: ""; }
    .computer.laptop { border-radius: 5px 5px 2px 2px; }
    .computer.server { border-radius: 3px; background: #e9edf2; }
    .computer.server::before { width: 22px; height: 14px; border-top: 2px solid #94a3b8; border-bottom: 2px solid #94a3b8; content: ""; }
    .computer.win { border-color: #2f70c0; color: #2f70c0; }
    .computer.mac { border-color: #6b7280; }
    .computer svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.5; }
    .host-name { color: var(--ink); font: 650 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .host-meta { margin-top: 4px; color: var(--muted); font-size: 10.5px; }
    .host-tools { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .tool { padding: 2px 5px; border: 1px solid var(--edge); border-radius: 4px; color: var(--muted); background: #fff; font: 9px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .host-status { color: var(--ok); font: 650 10px ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; }
    .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .kv { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 14px; padding: 10px 13px; border-top: 1px solid var(--soft-edge); }
    .kv:first-of-type { border-top: 0; }
    .kv-key { color: var(--muted); }
    .kv-value { min-width: 0; color: var(--ink); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .pr-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding: 14px 16px; border: 1px solid var(--edge); border-radius: 10px; background: #fff; box-shadow: var(--shadow); }
    .pr-head h1 { margin: 0; color: var(--ink); font-size: 17px; }
    .pr-head .pr-title { color: var(--muted); }
    .pr-head .right { margin-left: auto; display: flex; gap: 7px; }
    .pr-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
    .finding { padding: 14px; border-top: 1px solid var(--soft-edge); }
    .finding:first-of-type { border-top: 0; }
    .finding-top { display: flex; align-items: center; gap: 7px; }
    .finding h3 { margin: 8px 0 5px; color: var(--ink); font-size: 13px; }
    .finding p { margin: 0; color: var(--muted); font-size: 11.5px; line-height: 1.5; }
    .finding-path { color: var(--accent); font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sev { padding: 2px 6px; border-radius: 4px; font-size: 9.5px; font-weight: 700; text-transform: uppercase; }
    .sev.major { color: var(--bad); background: var(--bad-bg); }
    .sev.potential { color: var(--warn); background: var(--warn-bg); }
    .sev.minor { color: var(--muted); background: #eef1f4; }
    .cost-box { padding: 14px; }
    .cost-range { color: var(--ink); font-size: 22px; font-weight: 720; letter-spacing: -.02em; }
    .cost-copy { margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .muted { color: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    @media (max-width: 1050px) {
      .hero { grid-template-columns: minmax(0, 1fr) repeat(2, minmax(100px, 1fr)); }
      .hero .stat:nth-last-child(-n+2) { border-top: 1px solid var(--soft-edge); }
      .overview-grid, .pr-layout { grid-template-columns: 1fr; }
      .repo-grid, .bot-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .setup-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .topbar { align-items: flex-start; flex-wrap: wrap; gap: 8px 12px; padding: 9px 12px; }
      .brandcopy { display: none; }
      .nav { order: 3; width: 100%; overflow-x: auto; }
      .nav button { flex: 0 0 auto; padding: 7px 9px; }
      .live { margin-left: auto; }
      main { width: calc(100% - 24px); padding-top: 12px; }
      .hero { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero-main { grid-column: 1 / -1; }
      .stat { border-top: 1px solid var(--soft-edge); }
      .headline { font-size: 18px; }
      .toolbar { overflow-x: auto; flex-wrap: nowrap; }
      .search { flex: 0 0 220px; }
      .repo-grid, .bot-grid, .settings-grid { grid-template-columns: 1fr; }
      .card { overflow-x: auto; }
      table { min-width: 740px; }
      .activity-card { display: none; }
      .page-head { align-items: flex-start; }
      .page-head .right { display: none; }
      .kv { grid-template-columns: 1fr; gap: 4px; }
      .pr-head { align-items: flex-start; flex-wrap: wrap; }
      .pr-head .right { width: 100%; margin-left: 36px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <button class="brand" data-view="overview" aria-label="Code Review Queue overview" style="border:0;background:transparent;color:inherit;padding:0">
      <span class="brandmark">crq</span>
      <span class="brandcopy"><span class="brandname">Code Review Queue</span><span class="brandsub">fleet control</span></span>
    </button>
    <nav class="nav" aria-label="Dashboard">
      <button data-view="overview"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm10 7h6V11h-6v9ZM4 20h6v-3H4v3Zm10-13h6V4h-6v3Z"/></svg>Overview</button>
      <button data-view="repos"><svg viewBox="0 0 24 24"><path d="m12 2 8 4-8 4-8-4 8-4Zm8 9-8 4-8-4m16 5-8 4-8-4"/></svg>Repos</button>
      <button data-view="bots"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="13" rx="3"/><path d="M9 11h.01M15 11h.01M9 15h6M12 6V3"/></svg>Bots</button>
      <button data-view="setup"><svg viewBox="0 0 24 24"><path d="m14.7 6.3 3-3 3 3-3 3M4 20l6.5-6.5M15 14l5 5M4 4l5 5"/></svg>Setup</button>
